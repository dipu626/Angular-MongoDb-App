<div class="container my-5">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Employee Management</h2>
    <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#exampleModal"
            (click)="addClick()">
      + Add Employee
    </button>
  </div>

  <!-- Employee Table Card -->
  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-primary">
        <tr>
          <th>Employee Id</th>
          <th>Employee Name</th>
          <th>Department</th>
          <th>Date of Joining</th>
          <th>Options</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let emp of employees">
          <td>{{ emp.EmployeeId }}</td>
          <td>{{ emp.EmployeeName }}</td>
          <td>{{ emp.Department }}</td>
          <td>{{ emp.DateOfJoining }}</td>
          <td>
            <button class="btn btn-light btn-sm me-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#exampleModal"
                    (click)="editClick(emp)">
              <i class="bi bi-pencil-square text-primary"></i>
            </button>
            <button class="btn btn-light btn-sm shadow-sm" (click)="deleteClick(emp.EmployeeId)">
              <i class="bi bi-trash-fill text-danger"></i>
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Employee Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="exampleModalLabel">{{ modalTitle }}</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

          <div class="row g-3">
            <!-- Left column -->
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label fw-bold">Name</label>
                <input type="text" class="form-control shadow-sm" [(ngModel)]="EmployeeName">
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Department</label>
                <select class="form-select shadow-sm" [(ngModel)]="Department">
                  <option *ngFor="let dep of departments">{{ dep.DepartmentName }}</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Date of Joining</label>
                <input type="date" class="form-control shadow-sm" [(ngModel)]="DateOfJoining">
              </div>
            </div>

            <!-- Right column -->
            <div class="col-md-6 text-center">
              <img [src]="PhotoPath+PhotoFileName" alt="Employee Photo" width="250" height="250"
                   class="img-fluid shadow-sm rounded">
              <!-- <input class="form-control mt-3 shadow-sm" type="file" (change)="imageUpload($event)"> -->
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="button" class="btn btn-success me-2" *ngIf="EmployeeId==0" (click)="createClick()">
              Create
            </button>
            <button type="button" class="btn btn-primary" *ngIf="EmployeeId!=0" (click)="updateClick()">
              Update
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
