<div class="container my-5">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Employee Management</h2>
    <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#exampleModal"
            (click)="addClick()">
      + Add Employee
    </button>
  </div>

  <!-- Employee Table Card -->
  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-primary">
        <tr>
          <th>Employee Id</th>
          <th>Employee Name</th>
          <th>Department</th>
          <th>Date of Joining</th>
          <th>Options</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let emp of employees">
          <td>{{ emp.EmployeeId }}</td>
          <td>{{ emp.EmployeeName }}</td>
          <td>{{ emp.Department }}</td>
          <td>{{ emp.DateOfJoining }}</td>
          <td>
            <button class="btn btn-light btn-sm me-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#exampleModal"
                    (click)="editClick(emp)">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                   class="bi bi-pencil-square" viewBox="0 0 16 16">
                <path
                  d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                <path fill-rule="evenodd"
                      d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z" />
              </svg>
            </button>
            <button class="btn btn-light btn-sm shadow-sm" (click)="deleteClick(emp.EmployeeId)">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                   class="bi bi-trash-fill" viewBox="0 0 16 16">
                <path
                  d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1H2.5zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zM8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5zm3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0z" />
              </svg>
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Employee Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="exampleModalLabel">{{ modalTitle }}</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">

          <div class="row g-3">
            <!-- Left column -->
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label fw-bold">Name</label>
                <input type="text" class="form-control shadow-sm" [(ngModel)]="EmployeeName">
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Department</label>
                <select class="form-select shadow-sm" [(ngModel)]="Department">
                  <option *ngFor="let dep of departments">{{ dep.DepartmentName }}</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Date of Joining</label>
                <input type="date" class="form-control shadow-sm" [(ngModel)]="DateOfJoining">
              </div>
            </div>

            <!-- Right column -->
            <div class="col-md-6 text-center">
              <img [src]="PhotoPath+PhotoFileName" alt="Employee Photo" width="250" height="250"
                   class="img-fluid shadow-sm rounded">
              <!-- <input class="form-control mt-3 shadow-sm" type="file" (change)="imageUpload($event)"> -->
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="button" class="btn btn-success me-2" *ngIf="EmployeeId==0" (click)="createClick()">
              Create
            </button>
            <button type="button" class="btn btn-primary" *ngIf="EmployeeId!=0" (click)="updateClick()">
              Update
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
